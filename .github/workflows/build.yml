name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: Publish the installers as a GitHub Release (tag v<package.json version>)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  package:
    name: Installer (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            script: dist:win
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - os: macos-15
            script: dist:mac
            files: |
              release/*.dmg
          - os: ubuntu-24.04
            script: dist:linux
            files: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    # Includes downloading Tectonic and warming its package cache.
    timeout-minutes: 45
    env:
      HAS_CLOUD_IDS: ${{ secrets.REA_GOOGLE_CLIENT_ID != '' || secrets.REA_MICROSOFT_CLIENT_ID != '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add cloud app IDs
        # Optional repository secrets; without them users enter their own IDs in Options.
        if: env.HAS_CLOUD_IDS == 'true'
        shell: bash
        env:
          REA_GOOGLE_CLIENT_ID: ${{ secrets.REA_GOOGLE_CLIENT_ID }}
          REA_GOOGLE_CLIENT_SECRET: ${{ secrets.REA_GOOGLE_CLIENT_SECRET }}
          REA_MICROSOFT_CLIENT_ID: ${{ secrets.REA_MICROSOFT_CLIENT_ID }}
        run: |
          node -e 'require("fs").writeFileSync("main/cloud-config.json", JSON.stringify({
            google: { clientId: process.env.REA_GOOGLE_CLIENT_ID || "", clientSecret: process.env.REA_GOOGLE_CLIENT_SECRET || "" },
            onedrive: { clientId: process.env.REA_MICROSOFT_CLIENT_ID || "" },
          }))'
      - name: Build installer
        # Windows builds are signed when signing secrets are set (see SIGNING.md):
        # Azure Artifact Signing first, then a certificate file. Otherwise unsigned.
        shell: bash
        env:
          SCRIPT: ${{ matrix.script }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          args=()
          if [ "$SCRIPT" = dist:win ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_SIGN_PROFILE" ]; then
            echo "Signing with Azure Artifact Signing as $AZURE_SIGN_PUBLISHER"
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            args=(
              "-c.win.azureSignOptions.publisherName=$AZURE_SIGN_PUBLISHER"
              "-c.win.azureSignOptions.endpoint=$AZURE_SIGN_ENDPOINT"
              "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGN_ACCOUNT"
              "-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGN_PROFILE"
            )
          elif [ "$SCRIPT" = dist:win ] && [ -n "$WIN_CSC_LINK" ]; then
            echo "Signing with the certificate in WIN_CSC_LINK"
          else
            echo "No signing secrets; building unsigned"
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD AZURE_CLIENT_SECRET
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run "$SCRIPT" -- "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rea-office-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    # Pushing a tag such as v0.1.0, or running the workflow by hand with
    # "release" ticked, publishes the installers as a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: installers
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = tag ]; then TAG="$REF_NAME"; else TAG="v$(node -p 'require("./package.json").version')"; fi
          ls -la installers
          gh release create "$TAG" installers/* \
            --repo "$REPO" \
            --target "$SHA" \
            --title "Work $TAG" \
            --notes "Download **Work-Setup-${TAG#v}.exe** for Windows, the .dmg for macOS, or the .AppImage / .deb for Linux. If Windows shows an unknown-publisher warning, choose More info, then Run anyway. Connect Claude in File > Options."
